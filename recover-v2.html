<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gegevens herstellen</title><style>body{font-family:system-ui,sans-serif;background:#f4f5ef;color:#20251f;margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{max-width:430px;background:white;border:1px solid #dfe1d8;border-radius:24px;padding:24px}.ok{color:#45624d}p{color:#6b7168;line-height:1.5}</style></head><body><div class="card"><h1 id="t">Gegevens herstellen…</h1><p id="m">Even wachten.</p></div><script>(()=>{const KEY='mijnPersoonlijkeAppV1',t=document.getElementById('t'),m=document.getElementById('m');function dec(v){v=(v||'').replace(/-/g,'+').replace(/_/g,'/');while(v.length%4)v+='=';const b=atob(v),a=Uint8Array.from(b,c=>c.charCodeAt(0));return new TextDecoder().decode(a)}try{const raw=(location.hash.match(/(?:^#|&)data=([^&]+)/)||[])[1]||new URLSearchParams(location.search).get('data');if(!raw)throw Error('Geen herstelgegevens ontvangen.');const food=JSON.parse(dec(decodeURIComponent(raw))),cur=JSON.parse(localStorage.getItem(KEY)||'{}');const keys=['weekPlan','weekMenu','shopping','foodPrefs','pantry','favorites','recipeHistory','shoppingSkippedCount'];keys.forEach(k=>{if(Object.prototype.hasOwnProperty.call(food,k))cur[k]=food[k]});localStorage.setItem(KEY,JSON.stringify(cur));const n=Array.isArray(food.weekPlan)?food.weekPlan.length:0,p=Array.isArray(food.pantry)?food.pantry.length:0;t.textContent='Herstel gelukt';t.className='ok';m.textContent=`${n} menu-items en ${p} voorraaditems zijn teruggezet. De app opent nu.`;setTimeout(()=>location.replace('./?open=food&herstel=gelukt'),900)}catch(e){t.textContent='Herstel niet gelukt';m.textContent=e&&e.message?e.message:'Onbekende fout.'}})();</script></body></html>
