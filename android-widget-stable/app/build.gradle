plugins { id 'com.android.application' }

android {
    namespace 'nl.mijnpersoonlijkeapp.widgets'
    compileSdk 35

    signingConfigs {
        debug {
            storeFile file("${rootProject.projectDir}/.signing/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'nl.mijnpersoonlijkeapp.widgettest'
        minSdk 26
        targetSdk 35
        versionCode 31
        versionName 'mijn-dag-3.3-gelijke-widgets-zonder-rand'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
}
