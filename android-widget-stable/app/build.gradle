plugins { id 'com.android.application' }
// Final v33 build trigger

android {
    namespace 'nl.mijnpersoonlijkeapp.widgets'
    compileSdk 35

    signingConfigs {
        debug {
            storeFile file("${rootProject.projectDir}/.signing/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'nl.mijnpersoonlijkeapp.widgetveilig'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName 'mijn-dag-widget-compacte-regels-7'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
