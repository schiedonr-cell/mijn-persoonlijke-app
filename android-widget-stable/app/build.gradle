plugins { id 'com.android.application' }
// Final v33 build trigger

android {
    namespace 'nl.mijnpersoonlijkeapp.widgets'
    compileSdk 35

    signingConfigs {
        debug {
            storeFile file("${rootProject.projectDir}/.signing/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'nl.mijnpersoonlijkeapp.widgettest'
        minSdk 26
        targetSdk 35
        versionCode 44
        versionName 'mijn-dag-4.6-notities-cachefix'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
}
