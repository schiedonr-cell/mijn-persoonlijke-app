name: Bouw Mijn Dag TEST APK

on:
  workflow_dispatch:
  push:
    branches:
      - mijn-dag-nieuw-beginscherm-20261017
    paths:
      - index.html
      - .github/workflows/build-mijn-dag-test.yml
      - android-widget-stable/**
      - test-preview/**

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Maak veilige losse testapp
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil, re
          base = Path('android-widget-stable/app/src/main')
          assets = base/'assets'/'preview'
          assets.mkdir(parents=True,exist_ok=True)
          html = Path('index.html').read_text(encoding='utf-8')
          html = html.replace(
            "'serviceWorker'in navigator&&location.protocol.startsWith('http')&&!new URLSearchParams(location.search).has('nativev')",
            "false")
          banner = ('<div role="status" style="position:sticky;top:0;z-index:99999;padding:10px;'
            'background:#fff1ca;color:#352805;text-align:center;font:700 14px sans-serif;">'
            'Mijn Dag GELUIDSTEST 4 · Eigen gegevens · Geen widgets</div>')
          html = html.replace('<body>', '<body>'+banner, 1)
          html = html.replace('</body>','<script src="./PreviewDiagnostics.js"></script></body>',1)
          (assets/'index.html').write_text(html,encoding='utf-8')
          for path in Path('.').glob('*.js'):
            shutil.copyfile(path,assets/path.name)
          shutil.copyfile('test-preview/PreviewDiagnostics.js',assets/'PreviewDiagnostics.js')
          manifest = base/'AndroidManifest.xml'
          xml = manifest.read_text(encoding='utf-8')
          xml = xml.replace('android:label="Mijn dag"','android:label="Mijn Dag GELUIDSTEST 4"')
          xml = re.sub(r'\s*<receiver\b[\s\S]*?</receiver>', '', xml)
          manifest.write_text(xml,encoding='utf-8')
          gradle = Path('android-widget-stable/app/build.gradle')
          conf = gradle.read_text(encoding='utf-8')
          conf = conf.replace("applicationId 'nl.mijnpersoonlijkeapp'",
                              "applicationId 'nl.mijnpersoonlijkeapp.geluidstest4'")
          # De emulator-tests worden alleen in de tijdelijke buildomgeving toegevoegd.
          conf = conf.replace("versionName '3.3'", "versionName '3.3'\n        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'")
          conf += "\n\ndependencies {\n    androidTestImplementation 'androidx.test:runner:1.6.2'\n    androidTestImplementation 'androidx.test.ext:junit:1.2.1'\n}\n"
          gradle.write_text(conf,encoding='utf-8')
          source = base/'java/nl/mijnpersoonlijkeapp/widgets/MainActivity.java'
          shutil.copyfile(Path('test-preview/PreviewAlarmReceiver.java'),source.parent/'PreviewAlarmReceiver.java')
          itests=base.parent/'androidTest/java/nl/mijnpersoonlijkeapp/widgets'
          itests.mkdir(parents=True,exist_ok=True)
          shutil.copyfile('test-preview/PreviewAlarmInstrumentedTest.java',itests/'PreviewAlarmInstrumentedTest.java')
          xml=manifest.read_text(encoding='utf-8')
          xml=xml.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">','<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>')
          xml=xml.replace('</application>','<receiver android:name=".PreviewAlarmReceiver" android:exported="false"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/></intent-filter></receiver></application>')
          manifest.write_text(xml,encoding='utf-8')
          source.write_text(r'''package nl.mijnpersoonlijkeapp.widgets;

          import android.app.Activity;
          import android.os.Bundle;
          import android.annotation.SuppressLint;
          import android.graphics.Color;
          import android.net.Uri;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.JavascriptInterface;
          import java.io.InputStream;
          import java.io.ByteArrayInputStream;

          public class MainActivity extends Activity {
              private static final String HOST = "mijndag-test.android";
              private WebView web;
              @Override
              @SuppressLint("SetJavaScriptEnabled")
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  web = new WebView(this);
                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(false);
                  web.addJavascriptInterface(new PreviewBridge(), "AndroidWidgetBridge");
                  if (android.os.Build.VERSION.SDK_INT >= 33
                        && checkSelfPermission("android.permission.POST_NOTIFICATIONS") != android.content.pm.PackageManager.PERMISSION_GRANTED)
                      requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 202);
                  PreviewAlarmReceiver.restore(this);
                  web.setBackgroundColor(Color.WHITE);
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return !HOST.equals(request.getUrl().getHost());
                      }
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          if (!HOST.equals(uri.getHost())) return null;
                          String path = Uri.decode(uri.getPath());
                          if (path == null || path.equals("/")) path="/index.html";
                          if (path.contains("..")) return null;
                          String mime="text/plain";
                          if (path.endsWith(".html")) mime="text/html";
                          else if (path.endsWith(".js")) mime="application/javascript";
                          else if (path.endsWith(".css")) mime="text/css";
                          else if (path.endsWith(".png")) mime="image/png";
                          else if (path.endsWith(".json")) mime="application/json";
                          try {
                              InputStream data=getAssets().open("preview"+path);
                              return new WebResourceResponse(mime, "UTF-8", data);
                          } catch (Exception ex) {
                              return new WebResourceResponse("text/plain","UTF-8",new ByteArrayInputStream(new byte[0]));
                          }
                      }
                  });
                  setContentView(web);
                  web.loadUrl("https://"+HOST+"/index.html?nativev=1");
              }
              private class PreviewBridge {
                  @JavascriptInterface public String getTestStatus() {
                      boolean allowed=android.os.Build.VERSION.SDK_INT<33 ||
                          checkSelfPermission("android.permission.POST_NOTIFICATIONS")==android.content.pm.PackageManager.PERMISSION_GRANTED;
                      String last=getSharedPreferences("preview_debug",MODE_PRIVATE).getString("last_alarm","");
                      org.json.JSONObject status=new org.json.JSONObject();
                      try {
                          status.put("version","GELUIDSTEST 4");
                          status.put("alarmVolume",PreviewAlarmReceiver.alarmVolume(MainActivity.this));
                          status.put("alarmVolumeMax",PreviewAlarmReceiver.alarmVolumeMax(MainActivity.this));
                          status.put("audioStatus",getSharedPreferences("preview_debug",MODE_PRIVATE).getString("audio_status","nog niet afgespeeld"));
                          status.put("notificationsAllowed",allowed);
                          status.put("lastAlarm",last);
                          status.put("focusScheduled",PreviewAlarmReceiver.focusScheduled(MainActivity.this));
                      }catch(Exception ignored){}
                      return status.toString();
                  }
                  @JavascriptInterface public void testDirectNotification(){
                      PreviewAlarmReceiver.testNotification(MainActivity.this);
                  }
                  @JavascriptInterface public void openNotificationSettings(){
                      runOnUiThread(()->{
                          android.content.Intent intent=new android.content.Intent("android.settings.APP_NOTIFICATION_SETTINGS");
                          intent.putExtra("android.provider.extra.APP_PACKAGE",getPackageName());
                          startActivity(intent);
                      });
                  }
                  @JavascriptInterface public void scheduleReminder(String id,String title,String body,double at,String target) {
                      PreviewAlarmReceiver.schedule(MainActivity.this,id,title,body,(long)at,0);
                  }
                  @JavascriptInterface public void cancelReminder(String id) {
                      PreviewAlarmReceiver.cancel(MainActivity.this,id);
                  }
                  @JavascriptInterface public void scheduleDailyItemReminder(String id,String title,String body,String time,String target,boolean done) {
                      if(done){cancelReminder(id);return;}
                      long when=atTime(time,1);
                      PreviewAlarmReceiver.schedule(MainActivity.this,id,title,body,when,1);
                  }
                  @JavascriptInterface public void scheduleEveryDaysReminder(String id,String title,String body,double first,int days,String target){
                      PreviewAlarmReceiver.schedule(MainActivity.this,id,title,body,(long)first,Math.max(1,days));
                  }
                  @JavascriptInterface public void scheduleFocusNamed(int seconds,String name){
                      PreviewAlarmReceiver.focus(MainActivity.this,seconds,name);
                  }
                  @JavascriptInterface public void scheduleDayPlanFocus(int seconds,String name,double endsAt){
                      PreviewAlarmReceiver.dayFocus(MainActivity.this,seconds,name);
                  }
                  @JavascriptInterface public void cancelDayPlanFocus(){
                      PreviewAlarmReceiver.cancelDayFocus(MainActivity.this);
                  }
                  @JavascriptInterface public void cancelFocus(){PreviewAlarmReceiver.cancelFocus(MainActivity.this);}
                  @JavascriptInterface public void pauseFocus(int remain,String name){PreviewAlarmReceiver.cancelFocus(MainActivity.this);}
                  private long atTime(String time,int days){
                      java.util.Calendar c=java.util.Calendar.getInstance();
                      String[] part=time.split(":");
                      try{c.set(java.util.Calendar.HOUR_OF_DAY,Integer.parseInt(part[0]));c.set(java.util.Calendar.MINUTE,Integer.parseInt(part[1]));c.set(java.util.Calendar.SECOND,0);if(c.getTimeInMillis()<System.currentTimeMillis())c.add(java.util.Calendar.DATE,days);}catch(Exception ex){return System.currentTimeMillis()+60000;}
                      return c.getTimeInMillis();
                  }
              }
              @Override
              public void onBackPressed() {
                  if (web!=null && web.canGoBack()) web.goBack();
                  else super.onBackPressed();
              }
          }
          ''',encoding='utf-8')
          PY
      - name: Compileer losse test-APK
        working-directory: android-widget-stable
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Mijn-Dag-TEST-apk
          path: android-widget-stable/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  emulator-check:
    runs-on: ubuntu-latest
    needs: preview
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bouw het echte TEST-installatiebestand uit deze commit
        run: |
          # Herhaal de preview-transformatie via de gedeelde bouwstap in dezelfde workflow.
          python3 - <<'PY'
          from pathlib import Path
          import re,shutil
          text=Path('.github/workflows/build-mijn-dag-test.yml').read_text()
          match=re.search(r"(?ms)^      - name: Maak veilige losse testapp\n        run: \|\n(.*?)^      - name: Compileer losse test-APK",text)
          if not match:raise SystemExit("Preview bouwstap ontbreekt")
          script=match.group(1)
          commands=script.splitlines()
          script='\n'.join(line[10:] if line.startswith('          ') else line for line in commands)
          assert script.startswith("python3 - <<'PY'")
          Path('/tmp/build_preview_test.sh').write_text(script+'\n')
          PY
          bash /tmp/build_preview_test.sh
      - name: Android emulator ontvangt alarm op vastgestelde tijd
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle -p android-widget-stable :app:connectedDebugAndroidTest --no-daemon
