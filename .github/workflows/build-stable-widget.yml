name: Build stable Android widget APK

on:
  push:
    paths:
      - 'android-widget-stable/**'
      - '.github/workflows/build-stable-widget.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stable-widget-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reuse Android widget signing key
        uses: actions/cache@v4
        with:
          path: android-widget-stable/.signing/debug.keystore
          key: mijn-dag-widget-signing-key-v2
      - name: Create signing key when missing
        run: |
          mkdir -p android-widget-stable/.signing
          if [ ! -f android-widget-stable/.signing/debug.keystore ]; then
            keytool -genkeypair \
              -keystore android-widget-stable/.signing/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android-widget-stable
        run: gradle :app:assembleDebug --no-daemon
      # Eén directe APK-link voor installatie op Samsung (geen ZIP nodig).
      - name: Publish direct APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="android-widget-stable/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          if gh release view "mijn-dag-v90" >/dev/null 2>&1; then
            gh release upload "mijn-dag-v90" "$APK#Mijn-Dag-v90.apk" --clobber
          else
            gh release create "mijn-dag-v90" "$APK#Mijn-Dag-v90.apk" \
              --target "$GITHUB_SHA" \
              --title "Mijn Dag v90 – foto's in Samsung Galerij" \
              --notes "Android-update: foto's uit Notities openen rechtstreeks in Samsung Galerij. Installeer over de bestaande app heen."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mijn-dag-widget-v3-apk
          path: android-widget-stable/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-tool
          path: |
            /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner
            /usr/local/lib/android/sdk/build-tools/35.0.0/lib/apksigner.jar
          if-no-files-found: error
