name: Build stable Android widget APK

on:
  push:
    paths:
      - 'android-widget-stable/**'
      - '.github/workflows/build-stable-widget.yml'
  workflow_dispatch:

concurrency:
  group: stable-widget-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Voeg nieuwe Mijn Dag-interface toe aan Android
        run: |
          mkdir -p android-widget-stable/app/src/main/assets/app
          cp index.html android-widget-stable/app/src/main/assets/app/index.html
          cp ./*.js android-widget-stable/app/src/main/assets/app/
          cp ./*.png android-widget-stable/app/src/main/assets/app/
          cp manifest.webmanifest android-widget-stable/app/src/main/assets/app/
      - name: Bouw APK en controleer Android-tests
        working-directory: android-widget-stable
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mijn-dag-widget-v3-apk
          path: android-widget-stable/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-tool
          path: |
            /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner
            /usr/local/lib/android/sdk/build-tools/35.0.0/lib/apksigner.jar
          if-no-files-found: error

  emulator-check:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Zet gebundelde Mijn Dag-interface klaar
        run: |
          mkdir -p android-widget-stable/app/src/main/assets/app
          cp index.html android-widget-stable/app/src/main/assets/app/index.html
          cp ./*.js android-widget-stable/app/src/main/assets/app/
          cp ./*.png android-widget-stable/app/src/main/assets/app/
          cp manifest.webmanifest android-widget-stable/app/src/main/assets/app/
      - name: Geef emulator toegang tot hardwareversnelling
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Start Android en controleer app en opslag
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle -p android-widget-stable :app:connectedDebugAndroidTest --no-daemon
