name: Build stable Android widget APK

on:
  push:
    paths:
      - 'android-widget-stable/project.zip'
      - '.github/workflows/build-stable-widget.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack widget project
        run: |
          rm -rf /tmp/widget-build
          mkdir -p /tmp/widget-build
          unzip -q android-widget-stable/project.zip -d /tmp/widget-build
      - name: Build APK
        working-directory: /tmp/widget-build
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mijn-widgets-apk
          path: /tmp/widget-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
