name: Controle huishoudplanning
on:
  push:
    branches:
      - feature/huishouden-wassen-20261108
    paths:
      - index.html
      - .github/tests/housekeeping.test.cjs
      - .github/workflows/check-housekeeping.yml
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Controle JavaScript en huishoudregels
        run: node .github/tests/housekeeping.test.cjs
