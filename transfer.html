<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#45624d">
  <title>Gegevens overzetten</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f5ef;color:#20251f;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(100%,460px);background:#fff;border:1px solid #dfe1d8;border-radius:26px;padding:24px;box-shadow:0 10px 30px rgba(34,42,34,.08)}h1{font-size:28px;line-height:1.08;margin:0 0 12px}p{color:#6b7168;line-height:1.5;margin:0 0 20px}.status{font-size:13px;margin-top:14px;color:#6b7168}.button{width:100%;min-height:60px;border:0;border-radius:18px;background:#45624d;color:white;font-size:17px;font-weight:800}.button:disabled{opacity:.5}.secondary{margin-top:10px;background:#dce8de;color:#334a39}.ok{color:#45624d;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <h1>Gegevens overzetten</h1>
    <p>Hiermee zet je je huidige appgegevens één keer over naar Mijn dag.</p>
    <button class="button" id="share">Overzetten naar Mijn dag</button>
    <button class="button secondary" id="download" type="button">Alleen bestand downloaden</button>
    <div class="status" id="status"></div>
  </main>
  <script src="./note-blob-storage.js"></script>
  <script>
  (()=>{
    const status=document.getElementById('status'),share=document.getElementById('share'),download=document.getElementById('download');
    async function payload(){
      const entries={};
      const keep=['mijnPersoonlijkeAppV1','mijnPersoonlijkeAppRemindersV1','mijnPersoonlijkeAppCalendarEventsV1','mijnPersoonlijkeAppNotesV1'];
      for(const key of keep){
        const value=localStorage.getItem(key);
        if(value!=null) entries[key]=value;
      }
      const notes=JSON.parse(entries.mijnPersoonlijkeAppNotesV1||'{"notes":[]}').notes||[];
      if(notes.some(n=>(n.files||[]).some(f=>f.storage==='indexeddb'))){
        if(!window.MijnDagNoteBlobStorage)throw new Error('Bijlagenopslag niet beschikbaar.');
        entries.mijnPersoonlijkeAppNoteBlobsV1=await window.MijnDagNoteBlobStorage.exportPayload(notes);
      }
      return {version:3,exportedAt:Date.now(),entries};
    }
    async function text(){
      const data=JSON.stringify(await payload());
      if(data.length>15500000)throw new Error('Back-up te groot (maximaal circa 15 MB).');
      return data;
    }
    function hasData(){try{return Boolean(localStorage.getItem('mijnPersoonlijkeAppV1'));}catch{return false;}}
    function saveFile(data){
      const f=new File([data],'mijn-persoonlijke-app-overdracht.json',{type:'application/json'});
      const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;
      document.body.appendChild(a);a.click();
      setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
      status.textContent='Bestand gedownload. Ga terug naar Mijn dag en kies “Overdrachtsbestand kiezen”.';
    }
    async function exportToDevice(preferShare){
      if(!hasData()){status.textContent='Ik zie hier geen bestaande appgegevens.';return;}
      share.disabled=true;download.disabled=true;status.textContent='Gegevens en bestanden verzamelen…';
      try{
        const data=await text();
        if(preferShare && data.length<300000 && navigator.share){
          try{
            await navigator.share({title:'Mijn app gegevens',text:data});
            status.innerHTML='<span class="ok">Kies “Mijn dag” in het deelmenu.</span>';
            return;
          }catch(e){if(e?.name==='AbortError')return;}
        }
        saveFile(data);
      }catch(e){status.textContent='Overdracht niet gemaakt: '+(e?.message||'Onbekende fout');}
      finally{share.disabled=false;download.disabled=false;}
    }
    share.addEventListener('click',()=>exportToDevice(true));
    download.addEventListener('click',()=>exportToDevice(false));
    if(hasData())status.textContent='Je bestaande appgegevens zijn gevonden.';else{status.textContent='Nog geen appgegevens gevonden op deze plek.';share.disabled=true;}
  })();
  </script>
</body>
</html>
